<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BrandScan MVP</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">BRANDSCAN · MVP DIAGNOSTIC AGENT</p>
      <h1>브랜드 웹사이트를<br><span>진단하고 방향을 잡다</span></h1>
      <p>URL 하나로 MarTech·Technical SEO·GEO 상태를 확인하고, 무엇부터 개선할지 근거와 함께 제안합니다.</p>
      <form id="analyze-form" class="url-form">
        <label for="url">분석할 공개 웹페이지 URL</label>
        <div class="input-row">
          <input id="url" name="url" type="url" placeholder="https://example.com" required>
          <button type="submit">분석 시작</button>
        </div>
      </form>
      <p id="status" class="status" role="status"></p>
    </header>

    <section id="results" class="results" hidden>
      <div class="result-heading">
        <div>
          <p class="eyebrow">ANALYSIS RESULT</p>
          <h2 id="result-url"></h2>
        </div>
        <button id="download-report" class="secondary" type="button">PDF로 저장</button>
      </div>
      <div id="summary-cards" class="summary-grid"></div>
      <section class="priority-section">
        <div class="section-heading">
          <p class="eyebrow">TOP PRIORITIES</p>
          <h2>먼저 개선할 과제</h2>
        </div>
        <div id="priority-list" class="priority-grid"></div>
      </section>
      <section id="detail" class="detail-panel" hidden></section>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>

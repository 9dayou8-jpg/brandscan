<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BrandScan · 종합 진단 대시보드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="dash">
    <header class="hero">
      <div class="dash-top">
        <div>
          <p class="eyebrow">BRANDSCAN · BRAND WEBSITE DIAGNOSTIC</p>
          <h1>종합 진단 대시보드</h1>
          <p class="meta">공개 페이지에서 확인 가능한 근거 기반 진단 · 실제 검색 노출 성과는 포함하지 않음</p>
        </div>
        <div class="brand-stamp">BRANDSCAN</div>
      </div>
      <form id="analyze-form" class="url-form">
        <label for="url">분석할 공개 웹페이지 URL</label>
        <div class="input-row">
          <input id="url" name="url" type="url" placeholder="https://example.com" required>
          <button type="submit">분석 시작</button>
        </div>
        <p id="status" class="status" role="status"></p>
      </form>
    </header>

    <section id="results" class="results" hidden>
      <div class="result-heading">
        <div>
          <p class="eyebrow">ANALYSIS RESULT</p>
          <h2 id="result-url"></h2>
          <p id="analysis-meta" class="meta"></p>
        </div>
        <button id="download-report" class="secondary" type="button">PDF로 저장</button>
      </div>

      <div id="summary-cards" class="summary-grid"></div>

      <div class="section-title"><h2>우선 개선 과제 TOP 3</h2><span>영향도 × 시급성 × 실행 난이도</span></div>
      <div id="priority-list" class="issues"></div>

      <nav class="tabs" role="tablist" aria-label="진단 상세 카테고리">
        <button class="tab active" role="tab" aria-selected="true" data-tab="all" type="button">전체 요약</button>
        <button class="tab" role="tab" aria-selected="false" data-tab="martech" type="button">MarTech</button>
        <button class="tab" role="tab" aria-selected="false" data-tab="seo" type="button">Technical SEO</button>
        <button class="tab" role="tab" aria-selected="false" data-tab="geo" type="button">GEO · 콘텐츠</button>
      </nav>
      <section id="detail-panels" class="panels"></section>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
